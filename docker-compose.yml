version: '3.8'

services:
  # ============================================================================
  # Backend API Service (Node.js Express + Gemini AI + Supabase Client)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: archengine-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - archengine-network

  # ============================================================================
  # Frontend Web App (Nginx Reverse Proxy & High Performance Static Server)
  # ============================================================================
  frontend:
    image: nginx:alpine
    container_name: archengine-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - archengine-network

networks:
  archengine-network:
    driver: bridge
